on:
    pull_request:
    workflow_dispatch:

name: test
env:
    LANG: zh_CN.UTF-8
jobs:
    lint:
        if: ${{ vars.SHOPWELL_ACCEPTANCE_TESTS_ENABLED != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck

    build:
        if: ${{ vars.SHOPWELL_ACCEPTANCE_TESTS_ENABLED != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm pack --dry-run

    test:
        if: ${{ vars.SHOPWELL_ACCEPTANCE_TESTS_ENABLED != 'false' }}
        name: test platform customer contract
        timeout-minutes: 35
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        env:
            WEBSERVER_COMMAND: ""
            SHOPWELL_VERSION: customer-contract
            SHOPWELL_BUILD_SOURCE: platform
            SHOPWELL_BUILD_CONTEXT: ./.shopwell-platform
            SHOPWELL_TEST_DOCKERFILE: ${{ github.workspace }}/test-image.Dockerfile
            PORT: 8021
        steps:
            - uses: actions/checkout@v7

            - name: Checkout supported platform contract
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: shopwell-shop/shopwell
                  ref: 84d781302b84840c99abcf2a51cf46b5aeb399d7
                  path: .shopwell-platform
                  persist-credentials: false

            - id: changed-test-files
              uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
              with:
                  files: |
                      tests/**/*.spec.ts

            - name: Login into Github Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Build supported platform contract
              run: docker compose build init

            - name: Start supported platform contract
              run: docker compose up --pull=missing --quiet-pull --wait

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests against supported platform contract
              env:
                  APP_URL: http://localhost:8021
              run: npx playwright test --repeat-each 2

            - name: Execute changed testcases repeatedly against supported platform contract
              if: steps.changed-test-files.outputs.all_changed_files_count > 0
              env:
                  APP_URL: http://localhost:8021
              run: >-
                  npx playwright test
                  --repeat-each 10
                  ${{ steps.changed-test-files.outputs.all_changed_files }}

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report-customer-contract
                  path: test-results/
                  retention-days: 7

    test-saas:
        if: ${{ vars.SHOPWELL_ACCEPTANCE_TESTS_ENABLED != 'false' && (vars.SAAS_TESTS_ENABLED == 'true') }}
        timeout-minutes: 15
        runs-on: ubuntu-latest
        concurrency: saas # only allow one job at a time
        env:
            APP_URL: ${{ secrets.SAAS_APP_URL }}
            SHOPWELL_ADMIN_USERNAME: ${{ secrets.SAAS_SHOPWELL_ADMIN_USERNAME }}
            SHOPWELL_ADMIN_PASSWORD: ${{ secrets.SAAS_SHOPWELL_ADMIN_PASSWORD }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report-saas
                  path: test-results/
                  retention-days: 1
