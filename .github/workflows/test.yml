on:
    pull_request:
    workflow_dispatch:

name: test
jobs:
    versions:
        name: Determine Shopwell versions to test
        runs-on: ubuntu-24.04
        outputs:
            first-version: ${{ steps.versions.outputs.first-version }}
            latest-version: ${{ steps.versions.outputs.latest-version }}
        steps:
            - name: Generate versions
              id: versions
              uses: shopwell-shop/github-actions/versions@eb1996603ef58244d59e0ce6aeb2cb5af2fc4d66

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm pack --dry-run

    test:
        name: test shopwell ${{ matrix.SHOPWELL_VERSION_ID }}
        timeout-minutes: 25
        runs-on: ubuntu-latest
        needs: [versions]
        permissions:
            packages: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - SHOPWELL_VERSION: ${{ needs.versions.outputs.first-version }}
                      SHOPWELL_VERSION_ID: "first"
                      PORT: 8021
                    - SHOPWELL_VERSION: ${{ needs.versions.outputs.latest-version }}
                      SHOPWELL_VERSION_ID: "latest"
                      PORT: 8031
        env:
            WEBSERVER_COMMAND: "" # this will disable the log output
            SHOPWELL_VERSION: ${{ matrix.SHOPWELL_VERSION }}
            SHOPWELL_BUILD_SOURCE: "tag"
            PORT: ${{ matrix.PORT }}
        steps:
            - uses: actions/checkout@v7

            - id: changed-test-files
              uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
              with:
                  files: |
                      tests/**/*.spec.ts

            - name: Login into Github Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Start Shopwell ${{ matrix.SHOPWELL_VERSION }}
              run: docker compose up --pull=always --quiet-pull --wait

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests against Shopwell ${{ matrix.SHOPWELL_VERSION }}
              env:
                  APP_URL: http://localhost:${{ matrix.PORT }}
              run: npx playwright test --repeat-each 2

            - name: Execute changed testcases repeatedly ${{ matrix.SHOPWELL_VERSION }}
              if: steps.changed-test-files.outputs.all_changed_files_count > 0
              env:
                  APP_URL: http://localhost:${{ matrix.PORT }}
              run: >-
                  npx playwright test
                  --repeat-each 10
                  --
                  ${{ steps.changed-test-files.outputs.all_changed_files }}

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report-${{ matrix.SHOPWELL_VERSION }}
                  path: test-results/
                  retention-days: 7

    test-saas:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        concurrency: saas # only allow one job at a time
        env:
            APP_URL: ${{ secrets.SAAS_APP_URL }}
            SHOPWELL_ADMIN_USERNAME: ${{ secrets.SAAS_SHOPWELL_ADMIN_USERNAME }}
            SHOPWELL_ADMIN_PASSWORD: ${{ secrets.SAAS_SHOPWELL_ADMIN_PASSWORD }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report-saas
                  path: test-results/
                  retention-days: 1
