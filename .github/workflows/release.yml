on:
    push:
        branches:
            - trunk
    workflow_dispatch:
        inputs:
            publish_stable:
                description: 'Publish the stable version already prepared in package.json'
                required: true
                default: false
                type: boolean
name: release-please

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  release-type: node
                  token: ${{ secrets.GITHUB_TOKEN }}
            # The logic below handles the npm publication:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              # these if statements ensure that a publication only occurs when
              # a new release is created:
              if: ${{ steps.release.outputs.release_created }}
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: "24"
                  package-manager-cache: false
              if: ${{ steps.release.outputs.release_created }}
            - run: npm ci
              if: ${{ steps.release.outputs.release_created }}
            - run: npm publish --access public --provenance
              if: ${{ steps.release.outputs.release_created }}

    publish-stable:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Read stable release identity
              id: release
              shell: bash
              run: |
                  package_name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")

                  if [[ "$version" == *-* ]]; then
                    echo "Stable recovery cannot publish prerelease version $version" >&2
                    exit 1
                  fi

                  echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

                  if npm view "$package_name@$version" version --json >/dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi
            - run: npm ci
              if: ${{ steps.release.outputs.published != 'true' }}
            - run: npm run lint
              if: ${{ steps.release.outputs.published != 'true' }}
            - run: npm run typecheck
              if: ${{ steps.release.outputs.published != 'true' }}
            - run: npm run build
              if: ${{ steps.release.outputs.published != 'true' }}
            - name: Publish stable package
              if: ${{ steps.release.outputs.published != 'true' }}
              run: npm publish --access public --provenance
            - name: Verify npm publication
              shell: bash
              env:
                  PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
                  VERSION: ${{ steps.release.outputs.version }}
              run: |
                  for _ in {1..60}; do
                    published=$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>/dev/null | tr -d '"' || true)
                    if [[ "$published" == "$VERSION" ]]; then
                      exit 0
                    fi
                    sleep 5
                  done

                  echo "$PACKAGE_NAME@$VERSION is not queryable from npm" >&2
                  exit 1
            - name: Create GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.release.outputs.version }}
              run: |
                  tag="v$VERSION"

                  if gh release view "$tag" >/dev/null 2>&1; then
                    exit 0
                  fi

                  if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                    gh release create "$tag" --verify-tag --title "$tag" --generate-notes
                  else
                    gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
                  fi
